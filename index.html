<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanwal Kumar — AI engineer, Karachi. Portfolio for hiring teams & Clients.</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#0A1B2D">
<meta name="description" content="Kanwal Kumar — AI and automation engineer. Agents, automation, web apps, products and plugins. Stack, project teardowns, references and availability in one place.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kanwal Kumar — AI &amp; automation engineer">
<meta property="og:description" content="Agents, automation, web apps and plugins — built, deployed and maintained. Project teardowns, stack and availability in one place.">
<meta property="og:image" content="https://kanwalkumar.com/images/og.jpg">
<meta property="og:url" content="https://kanwalkumar.com/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link rel="canonical" href="https://kanwalkumar.com/">


<style>
:root{
  --paper:#FFFFFF; --tint:#F5F8FC; --ink:#0A1B2D; --body:#4C5C70; --muted:#5F6D80;
  --line:#E3E9F1; --line-soft:#EEF2F7;
  --signal:#1F5FD1; --signal-ink:#17408C; --signal-tint:#E9F1FD;
  --run:#0F7A55; --run-tint:#E4F2EC;
  --leak:#B4552F;
  --display:"Clash Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --text:"Switzer","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.3,1);
}

[data-theme="dark"]{
  --paper:#0A1B2D; --tint:#0F2A44; --ink:#EAF1F9; --body:#AEBECF; --muted:#8494A6;
  --line:#22384F; --line-soft:#182B3E;
  --signal:#5B9BFF; --signal-ink:#8FBAFF; --signal-tint:#12294A;
  --run:#3FBF8F; --run-tint:#123528;
  --leak:#E08A5F;
}
[data-theme="dark"] .nav{background:rgba(10,27,45,.9)}
[data-theme="dark"] code,[data-theme="dark"] .tech{background:var(--tint)}
[data-theme="dark"] .frame img,[data-theme="dark"] .msg--bot{filter:none}
.themebtn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.themebtn:hover{border-color:var(--signal)}
.themebtn svg{width:18px;height:18px}
.themebtn .moon{display:none}
[data-theme="dark"] .themebtn .sun{display:none}
[data-theme="dark"] .themebtn .moon{display:block}
[data-theme="dark"] .btn--dark{background:var(--signal);border-color:var(--signal)}
[data-theme="dark"] .btn--dark:hover{background:var(--signal-ink);border-color:var(--signal-ink)}
[data-theme="dark"] .tech .mono{background:#1B3350;color:#EAF1F9}


*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--text);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);color:var(--ink);font-weight:500;letter-spacing:-.025em;line-height:1.1;margin:0}
h1{font-size:clamp(2.3rem,5vw,3.9rem);letter-spacing:-.035em}
h2{font-size:clamp(1.8rem,3.3vw,2.6rem);letter-spacing:-.03em}
h3{font-size:1.25rem;line-height:1.25}
h4{font-size:1.02rem;line-height:1.35}
p{margin:0 0 1.05rem}
a{color:var(--signal);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,52px)}
.col{max-width:700px}
.band{padding-block:clamp(58px,8vw,110px);border-top:1px solid var(--line-soft)}
.band--flat{border-top:0}
.band--tint{background:var(--tint);border-top:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.lede{font-size:1.14rem}
.small{font-size:.875rem;line-height:1.6}
.dim{color:var(--muted)}
.need{border-bottom:1.5px dotted var(--leak);cursor:help}
code{font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.mark__pic{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
/* buttons  colour locked across every link state */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--signal);border:1px solid var(--signal);padding:11px 19px;border-radius:8px;font-size:.93rem;font-weight:500;transition:background .18s var(--ease),border-color .18s var(--ease)}
.btn,.btn:link,.btn:visited,.btn:hover,.btn:active,.btn:focus{color:#fff;text-decoration:none}
.btn:hover{background:var(--signal-ink);border-color:var(--signal-ink)}
.btn--ghost{background:transparent;border-color:#C9DBF7}
.btn--ghost,.btn--ghost:link,.btn--ghost:visited{color:var(--signal)}
.btn--ghost:hover,.btn--ghost:active,.btn--ghost:focus{color:var(--signal-ink);background:var(--signal-tint);border-color:#B4CEF3}
.btn--dark{background:var(--ink);border-color:var(--ink)}
.btn--dark:hover{background:#132B44;border-color:#132B44}
.btn--sm{padding:8px 15px;font-size:.87rem}

/* nav */
.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.93);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line-soft)}
.nav__in{display:flex;align-items:center;gap:20px;height:66px;max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,52px)}
.mark{font-family:var(--display);font-weight:600;font-size:1.02rem;color:var(--ink);display:flex;align-items:center;gap:9px}
.mark:hover{text-decoration:none}
.mark__dot{width:7px;height:7px;border-radius:50%;background:var(--run)}
.nav__links{display:flex;gap:20px;margin-left:auto;align-items:center}
.nav__links a{color:var(--body);font-size:.92rem}
.nav__links a:hover{color:var(--ink);text-decoration:none}
.nav__burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:0;width:40px;height:38px;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav__burger span{display:block;width:17px;height:1.5px;background:var(--ink);border-radius:2px;transition:transform .22s var(--ease),opacity .22s var(--ease)}
.nav__burger[aria-expanded=true] span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.nav__burger[aria-expanded=true] span:nth-child(2){opacity:0}
.nav__burger[aria-expanded=true] span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--signal);width:0}

/* left rail */
.rail{position:fixed;left:32px;top:0;height:100vh;z-index:40;display:flex;align-items:center;pointer-events:none}
.rail__line{position:relative;width:1px;background:var(--line);height:min(62vh,500px)}
.rail__dot{position:absolute;left:-4.5px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1px solid var(--line);pointer-events:auto;transition:background .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease)}
.rail__dot.on{background:var(--run);border-color:var(--run);transform:scale(1.15)}
.rail__dot::after{content:attr(data-label);position:absolute;left:19px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .25s}
.rail__dot:hover::after,.rail__dot.on::after{opacity:1}
@media(max-width:1340px){.rail{display:none}}

/* hero */
.hero{padding-block:clamp(52px,7vw,96px) clamp(44px,6vw,76px)}
.hero__grid{display:grid;grid-template-columns:1fr 330px;gap:clamp(30px,5vw,62px);align-items:start}
.hero h1{margin-bottom:22px}
.hero__sub{font-size:1.16rem;max-width:44ch;margin-bottom:26px}
.hero__cta{display:flex;gap:11px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--run);background:var(--run-tint);color:var(--run);border-radius:999px;padding:6px 14px;font-size:.85rem;margin-bottom:18px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--run);animation:blip 2.4s infinite var(--ease)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.3}}

/* image slots */
.ph{width:100%;background:var(--tint);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted);line-height:1.75}
.ph b{display:block;color:var(--ink);font-weight:500;margin-bottom:5px;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.frame{width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--tint)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.sq{aspect-ratio:1/1}
.wide{aspect-ratio:16/10}

.facts{border:1px solid var(--line);border-radius:12px;margin-top:16px;overflow:hidden}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:11px 16px;font-size:.88rem;border-bottom:1px solid var(--line-soft)}
.facts div:last-child{border-bottom:0}
.facts b{font-weight:500;color:var(--ink);text-align:right}

/* metric strip */
.mstrip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mstrip div{padding:26px 24px;border-right:1px solid var(--line)}
.mstrip div:last-child{border-right:0}
.mstrip b{display:block;font-family:var(--display);font-size:2.1rem;color:var(--ink);letter-spacing:-.035em;line-height:1;margin-bottom:7px;font-variant-numeric:tabular-nums}
.mstrip span{font-size:.88rem;line-height:1.45;display:block}

/* stack marquee */
.mq{overflow:hidden;position:relative;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.mq__track{display:flex;gap:12px;width:max-content;animation:slide 46s linear infinite}
.mq--rev .mq__track{animation-direction:reverse;animation-duration:56s}
.mq:hover .mq__track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tech{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 17px;white-space:nowrap;flex:none}
.tech img{width:22px;height:22px;object-fit:contain}
.tech .mono{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:500;flex:none}
.tech span{font-size:.92rem;color:var(--ink)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:26px;margin-top:44px}
.group h4{margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.group ul{margin:0;padding:0;list-style:none;font-size:.94rem}
.group li{padding:4px 0}

/* filters + project cards */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0 8px}
.filters button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-size:.91rem;color:var(--body);transition:all .18s var(--ease)}
.filters button:hover{border-color:var(--signal);color:var(--signal-ink)}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters .count{font-family:var(--mono);font-size:10.5px;opacity:.65;margin-left:5px}
.pgrid{display:grid;gap:18px;margin-top:24px}
.pcard{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);color:var(--body);transition:border-color .2s var(--ease),transform .2s var(--ease);animation:pop .42s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pcard:hover{border-color:var(--signal);text-decoration:none;transform:translateY(-2px)}
.pcard__shot{background:var(--tint);border-right:1px solid var(--line);min-height:200px;overflow:hidden}
.pcard__shot .frame,.pcard__shot .ph{height:100%;border:0;border-radius:0}
.pcard__shot img{transition:transform .5s var(--ease)}
.pcard:hover .pcard__shot img{transform:scale(1.04)}
.pcard__body{padding:22px 24px 20px;display:flex;flex-direction:column}
.pcard__top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:3px 8px;color:var(--muted)}
.pill--live{border-color:var(--run);color:var(--run);background:var(--run-tint)}
.pill--demo{border-color:#C9DBF7;color:var(--signal-ink);background:var(--signal-tint)}
.pcard h3{margin-bottom:8px}
.pcard__d{font-size:.95rem;margin-bottom:12px}
.pcard__res{font-size:.9rem;color:var(--run);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{border:1px solid var(--line-soft);background:var(--tint);border-radius:6px;padding:4px 10px;font-family:var(--mono);font-size:10.5px;color:var(--body)}
.pcard__go{font-size:.88rem;color:var(--signal);margin-top:14px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--muted);font-size:.94rem}

/* workflow canvas */
.canvas{border:1px solid var(--line);border-radius:12px;background:var(--tint);overflow:hidden;margin:32px 0}
.canvas__bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.canvas__title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.canvas__bar .btn{margin-left:auto}
.canvas__stage{overflow-x:auto;padding:26px 20px}
.canvas svg{min-width:660px;width:100%;height:auto;display:block}
.wf-node rect{fill:#fff;stroke:var(--line);stroke-width:1;transition:stroke .3s var(--ease),fill .3s var(--ease)}
.wf-node text{font-family:var(--text);font-size:12px;fill:var(--body)}
.wf-node .wf-t{font-size:12.5px;fill:var(--ink);font-weight:500}
.wf-node{cursor:pointer}
.wf-node:hover rect{stroke:var(--signal)}
.wf-node.lit rect{stroke:var(--run);fill:var(--run-tint)}
.wf-node.sel rect{stroke:var(--signal);fill:var(--signal-tint)}
.wf-link{stroke:var(--line);stroke-width:1.5;fill:none;transition:stroke .3s var(--ease)}
.wf-link.lit{stroke:var(--run)}
.wf-dot{fill:var(--muted)}
.wf-node.lit .wf-dot{fill:var(--run)}
.canvas__note{border-top:1px solid var(--line);background:var(--paper);padding:16px 20px;font-size:.92rem;min-height:62px}
.canvas__note b{color:var(--ink);font-weight:500}

/* RAG demo */
.rag{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;margin-top:30px;max-width:860px}
.rag__bar{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--tint)}
.rag__bar i{width:8px;height:8px;border-radius:50%;background:var(--run);flex:none;animation:blip 2.4s infinite var(--ease)}
.rag__bar span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rag__body{padding:22px 24px}
.rag__seed{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rag__seed button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.86rem;color:var(--body);transition:border-color .18s,color .18s}
.rag__seed button:hover{border-color:var(--signal);color:var(--signal-ink)}
.chat{display:flex;flex-direction:column;gap:14px}
.chat__log{display:flex;flex-direction:column;gap:12px;min-height:130px;max-height:400px;overflow-y:auto;padding-right:4px}
.chat__empty{border:1px dashed #C9DBF7;background:var(--signal-tint);border-radius:10px;padding:18px 20px;font-size:.93rem;color:var(--signal-ink);line-height:1.6}
.msg{max-width:88%;font-size:.94rem;line-height:1.6;border-radius:12px;padding:11px 15px;white-space:pre-wrap}
.msg--you{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg--bot{align-self:flex-start;background:var(--paper);border:1px solid var(--line);color:var(--body);border-bottom-left-radius:4px}
.msg--err{align-self:flex-start;background:var(--paper);border:1px solid var(--leak);color:var(--leak);border-bottom-left-radius:4px}
.msg__src{display:block;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:normal}
.msg--think{display:flex;gap:5px;align-items:center;padding:15px}
.msg--think i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:think 1.3s infinite var(--ease)}
.msg--think i:nth-child(2){animation-delay:.18s}
.msg--think i:nth-child(3){animation-delay:.36s}
@keyframes think{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat__form{display:flex;gap:9px;align-items:flex-end}
.chat__form textarea{flex:1;font:inherit;font-size:.94rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px;resize:none;min-height:44px;max-height:110px;line-height:1.5}
.chat__form textarea:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-tint)}
.chat__form button{flex:none;height:44px}
.chat__form button:disabled{opacity:.45;cursor:not-allowed}
.chat__meter{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chat__meter b{font-weight:500;color:var(--ink)}
.chat__meter.low b{color:var(--leak)}
.chat__done{border:1px solid var(--line);background:var(--tint);border-radius:12px;padding:22px;text-align:center;font-size:.94rem}
.chat__done h4{margin-bottom:7px}
.chat__done p{margin-bottom:14px}

/* approach */
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-top:36px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pstep{padding:24px 22px 26px;border-right:1px solid var(--line);background:var(--paper)}
.pstep:last-child{border-right:0}
.pstep__n{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--signal);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pstep__n::after{content:"";flex:1;height:1px;background:var(--line)}
.pstep h4{margin-bottom:7px}
.pstep p{font-size:.92rem;margin:0}

/* references */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:34px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:24px 26px;background:var(--paper);display:flex;flex-direction:column}
.tcard p{font-family:var(--display);font-size:1.08rem;line-height:1.5;color:var(--ink);letter-spacing:-.012em;margin-bottom:18px}
.twho{display:flex;align-items:center;gap:12px;margin-top:auto}
.tavatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--signal-tint);color:var(--signal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.9rem;font-weight:500;flex:none}
.tavatar img{width:100%;height:100%;object-fit:cover}
.tname{font-size:.92rem;color:var(--ink)}
.trole{font-size:.82rem;color:var(--muted);line-height:1.4}

/* timeline */
.tl{border-left:1px solid var(--line);padding-left:26px;margin-top:30px}
.tl__item{position:relative;padding-bottom:30px}
.tl__item:last-child{padding-bottom:0}
.tl__item::before{content:"";position:absolute;left:-31px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1px solid var(--signal)}
.tl__when{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tl__item ul{margin:9px 0 0;padding-left:19px;font-size:.94rem}
.tl__item li{margin-bottom:5px}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px}
.cert{border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:.92rem}
.cert b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

.faq{border-top:1px solid var(--line);max-width:830px;margin-top:32px}
.q{border-bottom:1px solid var(--line)}
.q__btn{list-style:none;cursor:pointer;width:100%;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:19px 0;font-family:var(--display);font-size:1.06rem;color:var(--ink)}
.q__btn::-webkit-details-marker{display:none}
.q__btn::marker{content:""}

.q[open] .q__sign{transform:rotate(45deg)}
.q__a{padding:0 0 21px;font-size:.97rem;max-width:68ch}
.q__a p:last-child{margin-bottom:0}

/* contact */
.cgrid{display:grid;grid-template-columns:1fr 340px;gap:clamp(28px,5vw,58px);align-items:start}
.field{margin-bottom:14px}
.field label{display:block;font-size:.86rem;color:var(--ink);margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-tint)}
.field textarea{min-height:96px;resize:vertical}
.formbox{border:1px solid var(--line);border-radius:14px;padding:22px 24px;background:var(--paper)}

/* project detail */
.back{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.d__head{display:grid;grid-template-columns:1fr 300px;gap:44px;align-items:start;margin-top:22px}
.d__meta{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.d__meta div{display:flex;justify-content:space-between;gap:14px;padding:11px 17px;font-size:.87rem;border-bottom:1px solid var(--line-soft)}
.d__meta div:last-child{border-bottom:0}
.d__meta b{font-weight:500;color:var(--ink);text-align:right}
.d__ask{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px;background:var(--tint);font-size:.9rem}
.d__ask h4{margin-bottom:8px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin:28px 0}
.block{max-width:720px}
.block h3{margin:34px 0 12px}
.block ol,.block ul{padding-left:20px;font-size:.98rem}
.block li{margin-bottom:7px}
.callout{border-left:2px solid var(--signal);background:var(--signal-tint);padding:18px 22px;margin:26px 0;max-width:720px}
.callout h4{margin-bottom:8px;color:var(--signal-ink)}
.callout p:last-child{margin-bottom:0}
.hard{border-left:2px solid var(--leak);padding:2px 0 2px 20px;margin:26px 0;max-width:720px}
.hard h4{margin-bottom:7px}

.foot{border-top:1px solid var(--line);padding:34px 0;font-size:.88rem;color:var(--muted)}
.foot__in{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--body)}
.reveal{opacity:0;transform:translateY(13px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ---------- workflow canvas ---------- */
function canvasHTML(nodes,id){
  if(!nodes || !nodes.length) return "";
  var colW=160,gap=8,y=30,h=78, W=40+nodes.length*colW+(nodes.length-1)*gap, i,x;
  var s='<svg viewBox="0 0 '+W+' 150" role="img" aria-label="How the system runs, step by step">';
  for(i=0;i<nodes.length-1;i++){ x=20+i*(colW+gap)+colW;
    s+='<path class="wf-link" data-i="'+i+'" d="M'+x+' '+(y+h/2)+' H'+(x+gap)+'"/>'; }
  for(i=0;i<nodes.length;i++){ x=20+i*(colW+gap);
    s+='<g class="wf-node" data-i="'+i+'" tabindex="0" role="button" aria-label="'+esc(nodes[i].t)+'">'
      +'<rect x="'+x+'" y="'+y+'" width="'+colW+'" height="'+h+'" rx="8"/>'
      +'<circle class="wf-dot" cx="'+(x+16)+'" cy="'+(y+18)+'" r="3.5"/>'
      +'<text class="wf-t" x="'+(x+16)+'" y="'+(y+42)+'">'+esc(nodes[i].t)+'</text>'
      +'<text x="'+(x+16)+'" y="'+(y+61)+'" font-size="11" fill="#7F8DA0">'+esc(nodes[i].s)+'</text></g>'; }
  s+='</svg>';
  return '<div class="canvas" id="'+id+'"><div class="canvas__bar">'
    +'<span class="canvas__title">The system, step by step</span>'
    +'<button type="button" class="btn btn--ghost btn--sm" data-run>Play a run</button></div>'
    +'<div class="canvas__stage">'+s+'</div>'
    +'<div class="canvas__note">Click any step to see what it does  and why it is built that way.</div></div>';
}
function wireCanvas(root){
  root.querySelectorAll(".canvas").forEach(function(c){
    var nodes=c.querySelectorAll(".wf-node"), links=c.querySelectorAll(".wf-link");
    var note=c.querySelector(".canvas__note"), data=JSON.parse(c.getAttribute("data-nodes")||"[]");
    function pick(i){
      nodes.forEach(function(n){n.classList.remove("sel");});
      nodes[i].classList.add("sel");
      note.innerHTML='<b>'+esc(data[i].t)+'</b>  '+txt(data[i].d);
    }
    nodes.forEach(function(n,i){
      n.addEventListener("click",function(){pick(i);});
      n.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(i);}});
    });
    var running=false;
    function run(){
      if(running)return; running=true;
      nodes.forEach(function(n){n.classList.remove("lit");});
      links.forEach(function(l){l.classList.remove("lit");});
      if(reduced){ nodes.forEach(function(n){n.classList.add("lit");});
                   links.forEach(function(l){l.classList.add("lit");}); running=false; return; }
      var i=0;
      (function tick(){
        if(i>=nodes.length){running=false;return;}
        nodes[i].classList.add("lit");
        if(links[i])links[i].classList.add("lit");
        i++; setTimeout(tick,420);
      })();
    }
    c.querySelector("[data-run]").addEventListener("click",run);
    c._run=run;
  });
}

/* ---------- image + icon fallbacks ---------- */
function wireImages(root){
  root.querySelectorAll("img[data-ph-label]:not([data-w])").forEach(function(im){
    im.setAttribute("data-w","1");
    im.addEventListener("error",function(){
      var f=im.closest(".frame"), shape="";
      if(f){ if(f.classList.contains("sq"))shape="sq"; if(f.classList.contains("wide"))shape="wide"; }
      var d=document.createElement("div");
      d.className="ph "+shape;
      if(!shape) d.style.height="100%";
      d.innerHTML='<span><b>'+esc(im.getAttribute("data-ph-label"))+'</b>'+esc(im.getAttribute("data-ph-file"))+'</span>';
      (f||im).replaceWith(d);
    });
  });
  root.querySelectorAll("img[data-fb]:not([data-w])").forEach(function(im){
    im.setAttribute("data-w","1");
    im.addEventListener("error",function(){
      var s=document.createElement("span");
      s.className="mono"; s.textContent=im.getAttribute("data-fb");
      im.replaceWith(s);
    });
  });
}

  wireCanvas(app);

function initChat(){
  var chat=document.getElementById("chat"); if(!chat) return;
  var API=CONTACT.apiBase.replace(/\/$/,"");
  var log=document.getElementById("chatLog"),
      empty=document.getElementById("chatEmpty"),
      form=document.getElementById("chatForm"),
      input=document.getElementById("chatInput"),
      send=document.getElementById("chatSend"),
      meter=document.getElementById("chatMeter"),
      left=document.getElementById("chatLeft"),
      busy=false;

  var sid=localStorage.getItem("kk_sid");
  if(!sid){
    sid="s_"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    localStorage.setItem("kk_sid",sid);
  }

  function bubble(text,kind,sources){
    if(empty){empty.remove();empty=null;}
    var d=document.createElement("div");
    d.className="msg msg--"+kind;
    d.textContent=text;
    if(sources&&sources.length){
      var s=document.createElement("span");
      s.className="msg__src";
      s.textContent="From: "+sources.join(" · ");
      d.appendChild(s);
    }
    log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }

  function setLeft(n){
    if(!left) return;
    left.textContent=n;
    meter.classList.toggle("low",n<=2);
    if(n<=0) finish();
  }

  function finish(){
    if(form){form.remove();form=null;}
    if(meter){meter.remove();meter=null;}
    var d=document.createElement("div");
    d.className="chat__done";
    d.innerHTML='<h4>That is the demo</h4>'
      +'<p>If it answered what you needed, the next step is a conversation.</p>'
      +'<a class="btn btn--sm" href="mailto:'+esc(CONTACT.email)+'">Email me</a>';
    chat.appendChild(d);
  }

  function ask(question){
    if(busy||!question||!form) return;
    busy=true; send.disabled=true;
    input.value=""; input.style.height="auto";
    bubble(question,"you");

    var wait=document.createElement("div");
    wait.className="msg msg--bot msg--think";
    wait.innerHTML="<i></i><i></i><i></i>";
    log.appendChild(wait); log.scrollTop=log.scrollHeight;

    fetch(API+"/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:question,session_id:sid})
    })
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,data:d};});})
    .then(function(res){
      wait.remove();
      if(res.status===429){
        bubble(res.data.detail||"Question limit reached for this session.","err");
        finish(); return;
      }
      if(!res.ok) throw new Error();
      bubble(res.data.answer,"bot",res.data.sources);
      setLeft(res.data.remaining);
    })
    .catch(function(){
      wait.remove();
      bubble("That did not go through. Try again, or email "+CONTACT.email+".","err");
    })
    .then(function(){
      busy=false;
      if(send){send.disabled=false;input.focus();}
    });
  }

  form.addEventListener("submit",function(e){e.preventDefault();ask(input.value.trim());});

  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(input.value.trim());}
  });

  input.addEventListener("input",function(){
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,110)+"px";
  });

  app.querySelectorAll("[data-seed]").forEach(function(b){
    b.addEventListener("click",function(){ask(b.textContent.trim());});
  });

  fetch(API+"/session/"+sid)
    .then(function(r){return r.json();})
    .then(function(d){setLeft(d.remaining);})
    .catch(function(){});
}

function countUp(){
  if(reduced||typeof IntersectionObserver==="undefined")return;
  app.querySelectorAll("[data-count]").forEach(function(el){
    var raw=el.getAttribute("data-count"), suffix=el.getAttribute("data-suffix")||"";
    var mm=raw.match(/\d+/); if(!mm)return;
    var target=+mm[0], at=raw.indexOf(mm[0]), pre=raw.slice(0,at), post=raw.slice(at+mm[0].length);
    var nd=isNeed(raw), started=false;
    var o=new IntersectionObserver(function(en){
      en.forEach(function(x){
        if(!x.isIntersecting||started)return;
        started=true; o.disconnect();
        var t0=null;
        function frame(ts){
          if(!t0)t0=ts;
          var k=Math.min(1,(ts-t0)/900), v=Math.round(target*(1-Math.pow(1-k,3)));
          var body=esc(pre)+v+esc(post);
          el.innerHTML=(nd?'<span class="need" title="Replace with real data">'+body+'</span>':body)+esc(suffix);
          if(k<1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });
    },{rootMargin:"0px 0px -12% 0px"});
    o.observe(el);
  });
}

/* ---------- rail, reveal, progress ---------- */
var railObs=null, revObs=null;
function buildRail(){
  var line=document.getElementById("railline"); line.innerHTML="";
  var secs=app.querySelectorAll("[data-rail]");
  secs.forEach(function(s,i){
    var d=document.createElement("span");
    d.className="rail__dot";
    d.style.top=(secs.length<2?0:(i/(secs.length-1))*100)+"%";
    d.setAttribute("data-label",s.getAttribute("data-rail"));
    line.appendChild(d);
  });
}
function observe(){
  if(typeof IntersectionObserver==="undefined"){
    app.querySelectorAll(".band,.mstrip,.hero__grid").forEach(function(t){t.classList.add("in");});
    return;
  }
  if(railObs)railObs.disconnect(); if(revObs)revObs.disconnect();
  var secs=Array.prototype.slice.call(app.querySelectorAll("[data-rail]"));
  var dots=document.querySelectorAll(".rail__dot");
  railObs=new IntersectionObserver(function(en){
    en.forEach(function(x){var i=secs.indexOf(x.target);if(i>-1&&dots[i])dots[i].classList.toggle("on",x.isIntersecting);});
  },{rootMargin:"-45% 0px -45% 0px"});
  secs.forEach(function(s){railObs.observe(s);});
  revObs=new IntersectionObserver(function(en){
    en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");revObs.unobserve(x.target);}});
  },{rootMargin:"0px 0px -6% 0px"});
  app.querySelectorAll(".band,.mstrip,.hero__grid").forEach(function(t){t.classList.add("reveal");revObs.observe(t);});
}
